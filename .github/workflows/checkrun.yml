name: Check run probe
on:
  issue_comment:
    types: [created]
jobs:
  checkrun:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, 'make check ')
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          sha=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" -q .head.sha)
          conclusion=${COMMENT#make check }
          gh api -X POST "repos/$GH_REPO/check-runs" \
            -f name="pr_validation / integration_tests / verify_tests_status" \
            -f head_sha="$sha" -f status=completed -f conclusion="$conclusion" \
            -f "output[title]=Integration tests not run" \
            -f "output[summary]=Only skip-list paths changed; the build passed." -q '.id'
