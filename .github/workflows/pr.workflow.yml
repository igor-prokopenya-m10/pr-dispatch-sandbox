name: PR Validation
run-name: ${{ github.event_name == 'workflow_dispatch' && format('run checks on PR {0} ({1})', inputs.pr_number, inputs.mode) || 'dispatch run checks' }}
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        type: string
        required: true
      mode:
        type: string
        default: normal
jobs:
  dispatch:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, 'run checks')
    permissions:
      actions: write
      contents: read
      pull-requests: read
    uses: ./.github/workflows/dispatch.yml
    with:
      workflow: pr.workflow.yml
  pr_validation:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/workflow_pr.yml
    with:
      mode: ${{ inputs.mode }}
